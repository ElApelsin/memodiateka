<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Моя медиатека</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: одна колонка-лента «билетов», сверху счётчики и фильтры-чипы */
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#17202b; --muted:#5d6b7c; --line:#d5dce5;
  --accent:#2f5bd8; --film:#2f5bd8; --series:#0f8a6a; --cartoon:#c0620e; --anime:#b8327a;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --fg:#e7ecf2; --muted:#93a1b2; --line:#2a3440;
  --accent:#7e9ff5; --film:#7e9ff5; --series:#4cc9a3; --cartoon:#f0a052; --anime:#f07ab8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --fg:#e7ecf2; --muted:#93a1b2; --line:#2a3440;
  --accent:#7e9ff5; --film:#7e9ff5; --series:#4cc9a3; --cartoon:#f0a052; --anime:#f07ab8; color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font:700 clamp(26px,6vw,38px)/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-variant-numeric:tabular-nums;color:var(--muted)}
.stats b{color:var(--fg);font-family:var(--display);font-weight:500;font-size:18px;margin-right:4px}
.filters{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{width:100%;box-sizing:border-box;font:15px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stripe{background:var(--k)}
.main{padding:12px 0;min-width:0}
.t{font-weight:600;font-size:16px;margin:0}
.orig{color:var(--muted);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);margin-top:4px}
.kind{color:var(--k);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.note{margin:6px 0 0;font-size:14px}
.score{padding:12px 14px 12px 0;text-align:right;font-variant-numeric:tabular-nums}
.score b{font:700 22px var(--display);display:block}
.score small{display:block;color:var(--muted);font-size:11px;white-space:nowrap}
.status{font-size:12px;font-weight:500}
summary.item{list-style:none;cursor:pointer}
summary.item::-webkit-details-marker{display:none}
summary.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.card{background:var(--surface);border-radius:12px;border:1px solid var(--line);overflow:hidden}
details.card>.item{border:0;border-radius:0;background:transparent}
.chev{display:inline-block;color:var(--muted);font-size:12px;transition:transform .2s}
header{position:relative}
h1{padding-right:52px}
#theme{position:absolute;top:0;right:0;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer}
#theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details[open] .chev{transform:rotate(180deg)}
.more{display:flex;gap:14px;padding:0 14px 14px 20px}
.more img{width:96px;flex:none;border-radius:6px;align-self:flex-start;background:var(--line)}
.more>div{min-width:0;display:grid;gap:8px;font-size:14px}
.ext{margin:0;color:var(--fg)}
.pub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pub b{color:var(--fg)}
.mine{border-top:1px solid var(--line);padding-top:8px}
.mine b{font-family:var(--display);font-weight:500}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.empty{color:var(--muted);text-align:center;padding:32px 8px;border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-weight:500;margin-bottom:6px}
</style>

</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1>Моя медиатека</h1>
    <button id="theme" type="button" aria-label="Сменить тему"></button>
    <p class="sub">Фильмы, сериалы, мультфильмы и аниме.</p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Найти по названию, жанру или отзыву" aria-label="Поиск">
    <div class="row" id="kinds"></div>
    <div class="row" id="statuses"></div>
  </div>
  <div class="list" id="list"><div class="empty"><b>Загружаю библиотеку…</b></div></div>
</div>

<script>
const KINDS={film:"Фильм",series:"Сериал",cartoon:"Мультфильм",anime:"Аниме"};
const STAT={watched:"Посмотрено",watching:"Смотрю",want:"Хочу посмотреть",dropped:"Брошено"};
let items=[],fKind="all",fStat="all";
const $=id=>document.getElementById(id);
// Переключатель темы: выбор хранится в браузере, без выбора — тема устройства
(()=>{
  const root=document.documentElement,mq=matchMedia("(prefers-color-scheme:dark)"),b=$("theme");
  const dark=()=>root.dataset.theme?root.dataset.theme==="dark":mq.matches;
  const paint=()=>b.textContent=dark()?"☀":"☾";
  try{const t=localStorage.getItem("theme");if(t==="dark"||t==="light")root.dataset.theme=t}catch{}
  b.onclick=()=>{root.dataset.theme=dark()?"light":"dark";try{localStorage.setItem("theme",root.dataset.theme)}catch{}paint()};
  mq.addEventListener("change",paint);paint();
})();

function chips(el,map,get,set){
  el.innerHTML="";
  for(const [k,v] of [["all","Все"],...Object.entries(map)]){
    const b=document.createElement("button");b.className="chip";b.textContent=v;b.id="f-"+el.id+"-"+k;
    b.setAttribute("aria-pressed",get()===k);
    b.onclick=()=>{set(k);render()};el.append(b);
  }
}
function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML}

function render(){
  chips($("kinds"),KINDS,()=>fKind,v=>fKind=v);
  chips($("statuses"),STAT,()=>fStat,v=>fStat=v);
  const w=items.filter(i=>i.status==="watched"),rated=w.filter(i=>i.rating);
  const avg=rated.length?(rated.reduce((s,i)=>s+i.rating,0)/rated.length).toFixed(1):"–";
  $("stats").innerHTML=`<span><b>${w.length}</b>посмотрено</span><span><b>${items.filter(i=>i.status==="want").length}</b>в планах</span><span><b>${avg}</b>средняя оценка</span>`;
  const q=$("q").value.trim().toLowerCase();
  const shown=items.filter(i=>(fKind==="all"||i.kind===fKind)&&(fStat==="all"||i.status===fStat)&&
    (!q||[i.title,i.original,i.note,...(i.genres||[])].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(!items.length){$("list").innerHTML='<div class="empty"><b>Пока пусто</b>Скажите Claude в чате «посмотрел(а) …» или «подбери, что посмотреть», и тайтлы появятся здесь.</div>';return}
  if(!shown.length){$("list").innerHTML='<div class="empty"><b>Ничего не нашлось</b>Сбросьте фильтры или поиск.</div>';return}
  $("list").innerHTML=shown.map(i=>`
    <details class="card" data-id="${esc(i.id)}" style="--k:var(--${KINDS[i.kind]?i.kind:"film"})">
    <summary class="item">
      <div class="stripe"></div>
      <div class="main">
        <p class="t">${esc(i.title)}</p>
        ${i.original?`<div class="orig">${esc(i.original)}</div>`:""}
        <div class="meta"><span class="kind">${KINDS[i.kind]||""}</span>${i.year?`<span>${i.year}</span>`:""}${i.genres?.length?`<span>${esc(i.genres.join(", "))}</span>`:""}<span class="status">${STAT[i.status]||""}</span></div>
      </div>
      <div class="score">${i.rating?`<b>${i.rating}</b><small>моя оценка</small>`:""}<div class="chev" aria-hidden="true">▼</div></div>
    </summary>
    <div class="more"><div>
      <p class="ext">${i.wiki?"Загружаю описание…":"Описания пока нет."}</p>
      ${pub(i.ratings)}
      ${(i.note||i.rating)&&(i.status==="watched"||i.status==="dropped")?`<div class="mine">${i.rating?`<b>${i.rating}/10</b> `:""}${esc(i.note||"")}</div>`:""}
    </div></div>
    </details>`).join("");
}
function pub(r){
  if(!r)return"";
  const n={kp:"Кинопоиск",imdb:"IMDb",shiki:"Shikimori"};
  const parts=Object.entries(r).filter(([k,v])=>n[k]&&v).map(([k,v])=>`${n[k]} <b>${Number(v).toFixed(1)}</b>`);
  return parts.length?`<div class="pub">${parts.join(" · ")}</div>`:"";
}
// Описание и обложка грузятся из Википедии при первом раскрытии карточки
$("list").addEventListener("toggle",e=>{
  const d=e.target;if(!d.open||d.dataset.loaded)return;d.dataset.loaded=1;
  const i=items.find(x=>x.id===d.dataset.id);if(!i?.wiki)return;
  const box=d.querySelector(".more"),ext=d.querySelector(".ext");
  fetch("https://ru.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(i.wiki))
    .then(r=>{if(!r.ok)throw r.status;return r.json()})
    .then(w=>{
      ext.textContent=w.extract||"Описания нет.";
      if(w.thumbnail?.source){const im=new Image();im.src=w.thumbnail.source;im.alt="Постер: "+i.title;im.loading="lazy";box.prepend(im)}
      const s=document.createElement("div");s.className="src";
      s.innerHTML=`Описание: <a href="${esc(w.content_urls?.desktop?.page||"")}" target="_blank" rel="noopener">Википедия</a>, CC BY-SA`;
      ext.after(s);
    })
    .catch(()=>{ext.textContent="Не удалось загрузить описание из Википедии.";d.dataset.loaded=""});
},true);
$("q").addEventListener("input",render);

fetch("titles.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw r.status;return r.json()})
  .then(d=>{items=d;render()})
  .catch(()=>{$("list").innerHTML='<div class="empty"><b>Не удаётся загрузить</b>Проверьте соединение и обновите страницу.</div>'});

// Фон: лепестки сакуры в светлой теме, бегущие «дорожки схемы» в тёмной
(()=>{
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=$("bg"),x=c.getContext("2d"),mq=matchMedia("(prefers-color-scheme:dark)");
  const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":mq.matches};
  const R=Math.random,G=28; // G — шаг сетки дорожек
  let W,H,dark,petals,runners;
  function init(){
    const d=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    dark=isDark();
    petals=Array.from({length:Math.round(W*H/26000)+8},()=>({x:R()*W,y:R()*H,s:5+R()*7,v:.35+R()*.6,a:R()*6.28,w:.01+R()*.02,r:R()*6.28}));
    runners=Array.from({length:Math.round(W*H/60000)+5},spawn);
  }
  function spawn(){return{x:Math.round(R()*W/G)*G,y:Math.round(R()*H/G)*G,d:R()*4|0,n:0,life:40+R()*120|0,h:R()<.7?"126,159,245":"76,201,163"}}
  function frame(){
    if(dark){
      // затухающий след вместо полной очистки
      x.globalCompositeOperation="destination-out";x.fillStyle="rgba(0,0,0,.04)";x.fillRect(0,0,W,H);
      x.globalCompositeOperation="source-over";x.lineWidth=1;
      runners.forEach((r,i)=>{
        const dx=[2,0,-2,0][r.d],dy=[0,2,0,-2][r.d];
        x.strokeStyle=`rgba(${r.h},.45)`;x.beginPath();x.moveTo(r.x,r.y);r.x+=dx;r.y+=dy;x.lineTo(r.x,r.y);x.stroke();
        if((r.n+=2)%G===0){
          if(R()<.4){r.d=(r.d+(R()<.5?1:3))%4;x.fillStyle=`rgba(${r.h},.7)`;x.fillRect(r.x-1.5,r.y-1.5,3,3)}
          if(--r.life<0||r.x<0||r.x>W||r.y<0||r.y>H)runners[i]=spawn();
        }
      });
    }else{
      x.clearRect(0,0,W,H);
      for(const p of petals){
        p.a+=p.w;p.r+=p.w*1.5;p.y+=p.v;p.x+=Math.sin(p.a)*.7+.25;
        if(p.y>H+12){p.y=-12;p.x=R()*W}
        if(p.x>W+12)p.x=-12;
        x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,.55+.45*Math.cos(p.a));
        x.fillStyle="rgba(238,140,175,.5)";x.beginPath();
        x.moveTo(0,-p.s);x.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.7,p.s*.7,0,p.s);x.bezierCurveTo(-p.s*.7,p.s*.7,-p.s*.9,-p.s*.6,0,-p.s);
        x.fill();x.restore();
      }
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize",init);mq.addEventListener("change",init);
  new MutationObserver(init).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  init();frame();
})();
</script>
</body>
</html>
